<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Inventory - E-Commerce Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">E-Commerce Platform</div>
            <nav>
                <ul id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html">Products</a></li>
                    <li><a href="admin-dashboard.html">Dashboard</a></li>
                    <li><a href="admin-products.html">Products</a></li>
                    <li><a href="admin-orders.html">Orders</a></li>
                    <li><a href="admin-users.html">Users</a></li>
                    <li><a href="admin-inventory.html">Inventory</a></li>
                    <li><a href="#" onclick="logout(); return false;">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="products-header">
            <h1>Inventory Management</h1>
            <p>Monitor and update product stock levels</p>
        </div>

        <div id="inventoryError" class="message message-error hidden"></div>

        <div class="inventory-tabs">
            <button class="inventory-tab active" onclick="loadInventory('all')">All Products</button>
            <button class="inventory-tab" onclick="loadInventory('low-stock')">Low Stock</button>
            <button class="inventory-tab" onclick="loadInventory('out-of-stock')">Out of Stock</button>
        </div>

        <div id="inventoryContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading inventory...</p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin-inventory.js"></script>
</body>
</html>
