<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - E-Commerce Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">E-Commerce Platform</div>
            <nav>
                <ul id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html">Products</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container products-page">
        <div class="products-header">
            <h1>Our Products</h1>
            <p>Browse our collection of quality products</p>
        </div>

        <div class="products-controls">
            <div class="search-bar">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                >
                <button id="searchButton" class="btn btn-primary">Search</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Price Range</label>
                    <div class="price-filter">
                        <input
                            type="number"
                            id="minPrice"
                            placeholder="Min Price"
                            min="0"
                            step="0.01"
                        >
                        <span>to</span>
                        <input
                            type="number"
                            id="maxPrice"
                            placeholder="Max Price"
                            min="0"
                            step="0.01"
                        >
                    </div>
                </div>

                <div class="filter-actions">
                    <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                    <button id="clearFilters" class="btn btn-secondary">Clear</button>
                </div>
            </div>
        </div>

        <div id="productsError" class="message message-error hidden"></div>

        <div id="productsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
