<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - E-Commerce Platform</title>
    <link rel="icon" type="image/svg+xml" href="assets/Icons/j-solid-full.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo">
                    <span class="logo-j">J</span><span class="logo-mart">Mart</span>
                </a>
            </div>
            <nav>
                <ul id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html">Products</a></li>
                    <li><a href="orders.html">Orders</a></li>
                    <li><a href="#" onclick="logout(); return false;">Logout</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="profile.html" class="header-action-btn profile-btn" id="headerProfileBtn" title="Profile">
                    <span class="action-icon">👤</span>
                    <span class="action-text profile-text">Profile</span>
                </a>
                <a href="cart.html" class="header-action-btn cart-btn" id="headerCartBtn" title="Cart">
                    <span class="action-icon">🛒</span>
                    <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                    <span class="action-text">Cart</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container checkout-page">
        <div class="checkout-header">
            <h1>Checkout</h1>
            <p>Complete your purchase</p>
        </div>

        <div id="checkoutError" class="checkout-error hidden"></div>

        <div id="checkoutContainer">
            <div class="checkout-loading">
                <div class="spinner"></div>
                <p>Loading checkout...</p>
            </div>
        </div>
    </main>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>
