<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products - E-Commerce Platform</title>
    <link rel="icon" type="image/svg+xml" href="assets/Icons/j-solid-full.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo">
                    <span class="logo-j">J</span><span class="logo-mart">Mart</span>
                </a>
            </div>
            <nav>
                <ul id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="admin-dashboard.html">Dashboard</a></li>
                    <li><a href="admin-products.html">Products</a></li>
                    <li><a href="admin-orders.html">Orders</a></li>
                    <li><a href="admin-users.html">Users</a></li>
                    <li><a href="admin-inventory.html">Inventory</a></li>
                    <li><a href="#" onclick="logout(); return false;">Logout</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="profile.html" class="header-action-btn profile-btn" id="headerProfileBtn" title="Profile">
                    <span class="action-icon">👤</span>
                    <span class="action-text profile-text">Profile</span>
                </a>
                <a href="cart.html" class="header-action-btn cart-btn" id="headerCartBtn" title="Cart">
                    <span class="action-icon">🛒</span>
                    <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                    <span class="action-text">Cart</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="products-header">
            <h1>Manage Products</h1>
            <p>Create, update, and delete products</p>
        </div>

        <div id="productsError" class="message message-error hidden"></div>

        <div class="admin-header-actions">
            <button class="btn btn-primary" onclick="openAddProductModal()">Add New Product</button>
        </div>

        <div id="productsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin-products.js"></script>
</body>
</html>
