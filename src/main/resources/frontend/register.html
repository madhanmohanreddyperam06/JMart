<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JMart</title>
    <link rel="icon" type="image/svg+xml" href="assets/Icons/j-solid-full.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-j">J</span><span class="logo-mart">Mart</span>
                </div>
                <h1>Create Account</h1>
                <p>Join us today</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                        maxlength="150"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="100"
                    >
                    <div class="password-strength-indicator">
                        <span class="strength-text" id="passwordStrengthText">Password strength: </span>
                        <span class="strength-value" id="passwordStrengthValue">-</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="100"
                    >
                    <div class="password-match-indicator">
                        <span class="match-text" id="passwordMatchText">Passwords match: </span>
                        <span class="match-value" id="passwordMatchValue">-</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile</label>
                    <div class="mobile-input-container">
                        <select id="countryCode" name="countryCode" class="country-code-select">
                            <option value="+91">+91 (India)</option>
                            <option value="+1">+1 (USA)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+61">+61 (Australia)</option>
                            <option value="+81">+81 (Japan)</option>
                            <option value="+86">+86 (China)</option>
                            <option value="+49">+49 (Germany)</option>
                            <option value="+33">+33 (France)</option>
                        </select>
                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="Enter 10-digit mobile number"
                            required
                            autocomplete="tel"
                            maxlength="10"
                            pattern="[0-9]{10}"
                        >
                    </div>
                    <div class="mobile-validation-text" id="mobileValidationText"></div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        rows="3"
                        required
                        maxlength="255"
                    ></textarea>
                </div>

                <div id="registerError" class="auth-error hidden"></div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
