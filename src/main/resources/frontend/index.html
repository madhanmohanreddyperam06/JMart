<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - JMart</title>
    <link rel="icon" type="image/svg+xml" href="assets/Icons/j-solid-full.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header class="home-header">
        <div class="header-top">
            <div class="header-container">
                <div class="logo-section">
                    <button class="logo-btn">
                        <span class="logo-j">J</span><span class="logo-mart">Mart</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="header-main">
            <div class="header-container">
                <div class="search-section">
                    <div class="search-container">
                        <input type="text" class="search-input" placeholder="Search for Products, Brands and More">
                        <button class="search-btn">🔍</button>
                    </div>
                </div>
                
                <div class="user-actions">
                    <div class="user-section">
                        <span class="user-icon">👤</span>
                        <span class="user-name">Madhan</span>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="more-section">
                        <span class="more-text">More</span>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="cart-section">
                        <a href="cart.html" class="cart-link">
                            <span class="cart-icon">🛒</span>
                            <span class="cart-badge" id="cartBadge">0</span>
                            <span class="cart-text">Cart</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="category-nav">
            <div class="header-container">
                <div class="category-scroll">
                    <button class="category-item active">
                        <span class="category-icon">🎯</span>
                        <span class="category-name">For You</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">👔</span>
                        <span class="category-name">Fashion</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">📱</span>
                        <span class="category-name">Mobiles</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🔌</span>
                        <span class="category-name">Electronics</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">💄</span>
                        <span class="category-name">Beauty</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🏠</span>
                        <span class="category-name">Home</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🔧</span>
                        <span class="category-name">Appliances</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🧸</span>
                        <span class="category-name">Toys, ba...</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🍔</span>
                        <span class="category-name">Food & H...</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🚗</span>
                        <span class="category-name">Auto Acc...</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">⚽</span>
                        <span class="category-name">Sports &...</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🪑</span>
                        <span class="category-name">Furniture</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">📚</span>
                        <span class="category-name">Books</span>
                    </button>
                    <button class="category-item">
                        <span class="category-icon">🏍️</span>
                        <span class="category-name">2 Wheele...</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container products-page">
        <div class="products-header">
            <h1>Our Products</h1>
            <p>Browse our collection of quality products</p>
        </div>

        <div class="products-controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button id="searchButton" class="btn btn-primary">Search</button>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Price Range</label>
                    <div class="price-filter">
                        <input type="number" id="minPrice" placeholder="Min" min="0" step="0.01">
                        <span>to</span>
                        <input type="number" id="maxPrice" placeholder="Max" min="0" step="0.01">
                    </div>
                </div>

                <div class="filter-actions">
                    <button id="applyFilters" class="btn btn-primary">Apply</button>
                    <button id="clearFilters" class="btn btn-secondary">Clear</button>
                </div>
            </div>
        </div>

        <div id="productsError" class="message message-error hidden"></div>

        <div id="productsContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
