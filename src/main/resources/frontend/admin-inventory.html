<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Inventory - E-Commerce Platform</title>
    <link rel="icon" type="image/svg+xml" href="assets/Icons/j-solid-full.svg">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo">
                    <span class="logo-j">J</span><span class="logo-mart">Mart</span>
                </a>
            </div>
            <nav>
                <ul id="navLinks">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="admin-dashboard.html">Dashboard</a></li>
                    <li><a href="admin-products.html">Products</a></li>
                    <li><a href="admin-orders.html">Orders</a></li>
                    <li><a href="admin-users.html">Users</a></li>
                    <li><a href="admin-inventory.html">Inventory</a></li>
                    <li><a href="#" onclick="logout(); return false;">Logout</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="profile.html" class="header-action-btn profile-btn" id="headerProfileBtn" title="Profile">
                    <div class="action-icon-container">
                        <span class="action-icon"><i class="fa-solid fa-circle-user"></i></span>
                    </div>
                    <span class="action-text profile-text">Profile</span>
                </a>
                <a href="#" class="header-action-btn wishlist-btn" id="headerWishlistBtn" title="Wishlist">
                    <div class="action-icon-container">
                        <span class="wishlist-icon-wrapper">
                            <i class="fa-solid fa-heart wishlist-icon"></i>
                            <span class="wishlist-badge" id="wishlistBadge" style="display: none;">0</span>
                        </span>
                    </div>
                    <span class="action-text wishlist-text">Wishlist</span>
                </a>
                <a href="cart.html" class="header-action-btn cart-btn" id="headerCartBtn" title="Cart">
                    <div class="action-icon-container">
                        <span class="cart-icon-wrapper">
                            <i class="fa-solid fa-bag-shopping cart-icon"></i>
                            <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                        </span>
                    </div>
                    <span class="action-text cart-text">Bag</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="products-header">
            <h1>Inventory Management</h1>
            <p>Monitor and update product stock levels</p>
        </div>

        <div id="inventoryError" class="message message-error hidden"></div>

        <div class="inventory-tabs nav nav-pills mb-3 gap-2">
            <button class="inventory-tab nav-link active" onclick="loadInventory('all')">All Products</button>
            <button class="inventory-tab nav-link" onclick="loadInventory('low-stock')">Low Stock</button>
            <button class="inventory-tab nav-link" onclick="loadInventory('out-of-stock')">Out of Stock</button>
        </div>

        <div id="inventoryContainer">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading inventory...</p>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin-inventory.js"></script>
</body>
</html>
